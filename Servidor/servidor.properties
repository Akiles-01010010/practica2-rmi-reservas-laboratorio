# =====================================================================
#  Configuración del SERVIDOR RMI (Capa 2) y de la conexión a MySQL (Capa 3)
# =====================================================================

# ---------- RED / RMI ----------
# IP con la que los CLIENTES verán al servidor (Opción B: red local Wi-Fi/cable).
# El script 06_ejecutar_servidor.bat la DETECTA sola y la pasa con
# -Djava.rmi.server.hostname=%SERVER_IP%, que tiene prioridad sobre este valor.
# Este valor solo se usa si ejecutas el servidor sin el .bat.
# Si tu PC tiene varias tarjetas de red (Wi-Fi, VirtualBox, VMware, WSL...)
# es OBLIGATORIO fijarla; si no, el stub puede llevar una IP equivocada.
rmi.hostname=192.168.3.142
# Puerto del registro RMI (la "guía telefónica")
rmi.puertoRegistro=1099
# Puerto FIJO del objeto remoto (si no se fija, Java elige uno al azar y el firewall lo bloquea)
rmi.puertoObjeto=1100

# ---------- BASE DE DATOS (contenedor Docker mysql-reservas-lab) ----------
# connectTimeout = ms máximos para CONECTAR; socketTimeout = ms máximos esperando respuesta
db.url=jdbc:mysql://127.0.0.1:3310/laboratorio_rmi?connectTimeout=3000&socketTimeout=10000&sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.usuario=rmi_user
db.password=RmiLab2026
# Segundos máximos para obtener una conexión (DriverManager.setLoginTimeout)
db.loginTimeoutSeg=5
# Segundos máximos por consulta (Statement.setQueryTimeout)
db.queryTimeoutSeg=5
# Segundos que InnoDB espera por una fila bloqueada antes de abortar (innodb_lock_wait_timeout)
db.lockWaitTimeoutSeg=5

# ---------- REGLAS DE NEGOCIO ----------
# Segundos máximos esperando el candado (ReentrantLock.tryLock) de un equipo
reserva.lockTimeoutSeg=5
# Segundos que dura el estado EN_PROCESO si el alumno no confirma ni cancela
reserva.segundosBloqueoTemporal=60
# SOLO PARA LA PRUEBA 2 (desconexión): milisegundos que la transacción se queda
# abierta antes del commit, para que te dé tiempo de desconectar la red.
# En uso normal déjalo en 0.
reserva.demoraTransaccionMs=0

# Secreto con el que se "firma" (SHA-256) cada ticket. Simulado: NO es criptografía real de firma.
firma.secreto=Secreto-Simulado-Lab-RMI-2026
